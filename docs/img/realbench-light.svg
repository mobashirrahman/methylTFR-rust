<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 283" width="680" height="283" role="img" aria-label="On real whole-genome data, wall time 38 min in R against 217 s in Rust, a factor of 11. Peak memory 15.3 GiB against 12.3 GiB."><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px}.h{font-weight:600;font-size:14px}.v{font-weight:600}.c{font-size:11.5px}</style><rect x="150" y="6" width="12" height="12" rx="2" fill="#2a78d6"/><text x="168.0" y="16.5" class="" fill="#52514e" text-anchor="start">methylTFR (R)</text><rect x="280" y="6" width="12" height="12" rx="2" fill="#eb6834"/><text x="298.0" y="16.5" class="" fill="#52514e" text-anchor="start">methylTFR-rs (Rust)</text><text x="150.0" y="52.0" class="h" fill="#0b0b0b" text-anchor="start">Wall time</text><text x="138.0" y="81.5" class="" fill="#52514e" text-anchor="end">R, 1 thread</text><path d="M150,66 h326.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-326.0 z" fill="#2a78d6"/><text x="490.0" y="81.5" class="v" fill="#0b0b0b" text-anchor="start">2310 s</text><text x="138.0" y="117.5" class="" fill="#52514e" text-anchor="end">Rust, 16 threads</text><path d="M150,102 h27.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-27.0 z" fill="#eb6834"/><text x="191.0" y="117.5" class="v" fill="#0b0b0b" text-anchor="start">217 s</text><text x="235.0" y="117.5" class="" fill="#52514e" text-anchor="start">11x faster</text><line x1="150" y1="60" x2="150" y2="130" stroke="#d9d8d2"/><text x="150.0" y="160.0" class="h" fill="#0b0b0b" text-anchor="start">Peak memory</text><text x="138.0" y="189.5" class="" fill="#52514e" text-anchor="end">R</text><path d="M150,174 h326.0 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-326.0 z" fill="#2a78d6"/><text x="490.0" y="189.5" class="v" fill="#0b0b0b" text-anchor="start">15.3 GiB</text><text x="138.0" y="225.5" class="" fill="#52514e" text-anchor="end">Rust</text><path d="M150,210 h262.6 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-262.6 z" fill="#eb6834"/><text x="426.6" y="225.5" class="v" fill="#0b0b0b" text-anchor="start">12.3 GiB</text><text x="493.4" y="225.5" class="" fill="#52514e" text-anchor="start">1.2x less</text><line x1="150" y1="168" x2="150" y2="238" stroke="#d9d8d2"/><text x="150.0" y="277.0" class="c" fill="#52514e" text-anchor="start">ENCODE ENCSR663MXB primary T cell, the paper's own validation sample. 40.4M sites at coverage >= 5,</text><text x="150.0" y="292.0" class="c" fill="#52514e" text-anchor="start">632 JASPAR2020 motifs, 263.4M binding sites. AMD Ryzen 7 3700X.</text></svg>
