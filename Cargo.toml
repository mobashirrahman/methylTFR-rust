[package]
name = "methyltfr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Quantification of DNA methylation signatures in TFBS (Rust port of the methylTFR R package)"
license = "MIT"
publish = false

[[bin]]
name = "methyltfr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
