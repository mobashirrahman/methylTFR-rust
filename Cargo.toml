[package]
name = "methyltfr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Quantification of DNA methylation signatures in TFBS (Rust port of the methylTFR R package)"
license = "MIT"
publish = false

[[bin]]
name = "methyltfr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
thiserror = "2.0.21"
# M7 only (`docs/AGENT_PLAN.md` section 3). Over motifs, never inside one: each
# motif's floating-point reductions must stay in the order the sequential build
# used, so the output is byte-identical with and without threads.
rayon = "1.11.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
tempfile = "3.27.0"
criterion = { version = "0.8.1", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "thin"

# Criterion is not needed by the library, only by `cargo bench`; keeping it out of
# the default feature set keeps `cargo test` from paying for it.
[[bench]]
name = "methyltfr"
harness = false

[profile.bench]
lto = "thin"
